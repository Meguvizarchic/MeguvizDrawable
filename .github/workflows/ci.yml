name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JVM contracts
        run: bash gradlew --no-daemon check
      - name: ABI tool contracts
        run: python3 tools/test_dump_abi.py && python3 tools/test_check_abi_superset.py
      - name: Public core ABI still contains the released 1.0.0 API
        run: >-
          bash gradlew --no-daemon :core:jar
          && mkdir -p build/abi-now
          && python3 tools/dump_abi.py "$(ls core/build/libs/core-*.jar | grep -Ev -- '-(sources|javadoc)\.jar$')"
          --output build/abi-now/core-api.txt --metadata build/abi-now/core-api.json
          && python3 tools/check_abi_superset.py docs/abi/1.0.0/core-api.txt build/abi-now/core-api.txt
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Android build and lint
        run: bash gradlew -Pmeguviz.profile=android --no-daemon check :android:assembleDebugAndroidTest
      - name: Stage candidate artifacts
        run: >-
          bash gradlew -Pmeguviz.profile=android --no-daemon
          :core:publishCandidatePublicationToStagingRepository
          :android:publishCandidatePublicationToStagingRepository
      - name: Verify bundled licenses
        run: python3 tools/verify_candidate_licenses.py
      - name: Public Android ABI still contains the released 1.0.0 API
        run: >-
          mkdir -p build/abi-now
          && python3 tools/dump_abi.py "$(ls build/staging-maven/io/github/jichuo1/meguviz/meguviz-drawable-android/*/meguviz-drawable-android-*.aar)"
          --output build/abi-now/android-api.txt --metadata build/abi-now/android-api.json
          && python3 tools/check_abi_superset.py docs/abi/1.0.0/android-api.txt build/abi-now/android-api.txt
      - name: Build isolated release consumer with R8
        run: bash gradlew -p fixtures/consumer --no-daemon :app:assembleRelease :app:verifyCandidateResolution
      - name: Check Maven POM resolution
        run: bash gradlew -p fixtures/consumer -Pconsumer.metadata=pom --no-daemon :app:verifyCandidateResolution
      - name: Verify independent provider and R8
        run: >-
          bash gradlew -p fixtures/provider --no-daemon
          :provider:check :app:verifyCandidateResolution
          :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Check provider Maven POM resolution
        run: bash gradlew -p fixtures/provider -Pprovider.metadata=pom --no-daemon :app:verifyCandidateResolution
  bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Bridge modules build, lint and unit tests
        run: bash gradlew -Pmeguviz.profile=bridges --no-daemon check
      - name: Central-bound bridges against the released base library
        run: >-
          bash gradlew -Pmeguviz.profile=bridges -Pmeguviz.againstPublished=true --no-daemon
          :compose:check :meguviz-android:check :meguviz-ui:check
      - name: Bridge instrumentation APKs
        run: >-
          bash gradlew -Pmeguviz.profile=bridges --no-daemon
          :compose:assembleDebugAndroidTest :meguviz-android:assembleDebugAndroidTest
          :meguviz-ui:assembleDebugAndroidTest :lumen:assembleDebugAndroidTest
      - name: Stage every candidate and verify bundled licenses
        run: >-
          bash gradlew -Pmeguviz.profile=bridges --no-daemon publishCandidatePublicationToStagingRepository
          && python3 tools/verify_candidate_licenses.py
